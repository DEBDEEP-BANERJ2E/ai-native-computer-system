# AI-Native Computer System: CapabilityLite ABI Specification v1.0
# Calling Convention and Register Roles for 8 x 100-bit Capability Registers (c0–c7)

capability_model:
  register_count: 8
  metadata_width_bits: 100
  fields:
    tag: { width: 1, description: "1 = Valid, 0 = Invalid/NULL" }
    base: { width: 32, description: "32-bit spatial base address" }
    length: { width: 32, description: "32-bit bounded buffer length in bytes" }
    perms: { width: 3, description: "Bit 0: Read (1), Bit 1: Write (2), Bit 2: Exec (4, reserved)" }
    offset: { width: 32, description: "32-bit current cursor offset from base" }

registers:
  - index: 0
    name: "c0"
    abi_name: "cnull"
    type: "HARDWARE_IMMUTABLE"
    saver: "None"
    tag: 0
    base: "0x00000000"
    length: "0x00000000"
    perms: 0 # None
    role: "Hardwired NULL Capability (tag=0). Writing to c0 is silently discarded by hardware."

  - index: 1
    name: "c1"
    abi_name: "cram"
    type: "HARDWARE_IMMUTABLE"
    saver: "None"
    tag: 1
    base: "0x00000000"
    length: "0x00001000"
    perms: 3 # Read + Write
    role: "Global RAM Root Capability. Grants root authority over data memory. Writing to c1 is silently discarded by hardware."

  - index: 2
    name: "c2"
    abi_name: "cmmio"
    type: "HARDWARE_IMMUTABLE"
    saver: "None"
    tag: 1
    base: "0x80000000"
    length: "0x00010000"
    perms: 3 # Read + Write
    role: "Global MMIO Root Capability. Grants root authority over hardware telemetry, scheduler, and trap registers. Writing to c2 is silently discarded by hardware."

  - index: 3
    name: "c3"
    abi_name: "ca0"
    type: "PROCESS_WRITABLE"
    saver: "Caller"
    role: "Capability Function Argument 0 / Primary Return Capability / Active Process Data Region"

  - index: 4
    name: "c4"
    abi_name: "ca1"
    type: "PROCESS_WRITABLE"
    saver: "Caller"
    role: "Capability Function Argument 1 / Secondary Return Capability / Active Process Heap Region"

  - index: 5
    name: "c5"
    abi_name: "ct0"
    type: "PROCESS_WRITABLE"
    saver: "Caller"
    role: "Capability Temporary 0 / Stack Scratch Buffer Capability"

  - index: 6
    name: "c6"
    abi_name: "cs0"
    type: "PROCESS_WRITABLE"
    saver: "Callee"
    role: "Capability Saved Register 0 (Preserved across function calls)"

  - index: 7
    name: "c7"
    abi_name: "cs1"
    type: "PROCESS_WRITABLE"
    saver: "Callee"
    role: "Capability Saved Register 1 (Preserved across function calls)"

conventions:
  function_calls:
    argument_passing: "Capability arguments passed in ca0 (c3) and ca1 (c4)."
    return_values: "Capability returned in ca0 (c3)."
    caller_saved: "ca0 (c3), ca1 (c4), ct0 (c5) must be saved by the caller if live across calls."
    callee_saved: "cs0 (c6), cs1 (c7) must be preserved and restored by any callee modifying them."

  context_switching:
    security_invariant: >
      CapabilityLite operates on a pure untagged data memory datapath.
      Ordinary RAM words cannot store authoritative hardware capability tags.
      Therefore, serialized capability bytes in the Process Control Block (PCB)
      represent descriptive software metadata only.
    pcb_slot_layout_16bytes:
      offset_0x00: "uint32_t offset"
      offset_0x04: "uint32_t base"
      offset_0x08: "uint32_t length"
      offset_0x0C: "uint8_t  perms"
      offset_0x0D: "uint8_t  tag (descriptive metadata only)"
      offset_0x0E: "uint8_t  root_selector (0=NULL, 1=RAM_ROOT c1, 2=MMIO_ROOT c2)"
      offset_0x0F: "uint8_t  reserved_padding"
    restoration_protocol:
      valid_capability: >
        Because frozen CSETBOUNDS sets new.base = old.base + old.offset, the OS kernel
        restores a valid capability (tag == 1) through the following 4-step sequence:
        1. base_delta = pcb.base - selected_root.base
        2. CINCOFFSET cd, c_root, base_delta   # sets cd.base=root.base, cd.offset=base_delta
        3. CSETBOUNDS cd, cd,     pcb.length   # sets cd.base=pcb.base, cd.length=pcb.length, cd.offset=0
        4. CANDPERM   cd, cd,     pcb.perms    # restricts permissions
        5. CINCOFFSET cd, cd,     pcb.offset   # restores final cursor offset
        Hardware automatically verifies monotonic containment and sets tag := 1.
      containment_verification_rules:
        rule_1: "pcb.base >= selected_root.base"
        rule_2: "(uint64_t)pcb.base + pcb.length <= (uint64_t)selected_root.base + selected_root.length"
        rule_3: "pcb.offset <= pcb.length"
        rule_4: "(pcb.perms & ~selected_root.perms) == 0"
      invalid_capability: >
        If PCB tag == 0, the OS executes CCLEAR cd to set tag := 0, base := 0, length := 0, perms := 0.
    total_cap_context_bytes: 80 # 5 process registers (c3–c7) * 16 bytes
